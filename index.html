<!doctype html>
<!-- Boot default only: main.js replaces this from the in-app language setting
     before Vue renders. It must never be "en" — Chromium picks the CJK font
     fallback from this value, and on Linux lang="en" renders 「。」/「、」 with
     Western metrics (tiny and raised). -->
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/icon/KnoteIcon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#84cc16" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/knote-192.png" />
  <title>Knote</title>
  <script>
    // Apply the remembered theme before the first paint (App.vue owns it afterwards).
    try {
      var t = localStorage.getItem('knote-theme-v1')
      if (['light', 'dark', 'retro', 'glass', 'glass-dark'].indexOf(t) >= 0) {
        if (t === 'glass' || t === 'glass-dark') document.documentElement.classList.add('gl')
        document.documentElement.setAttribute('data-theme', t === 'glass' ? 'light' : t === 'glass-dark' ? 'dark' : t)
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // PWA: register only on secure origins — file:// (the Electron shell)
    // and plain-http LAN hosts don't support service workers anyway
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {})
      })
    }
  </script>
</body>

</html>
