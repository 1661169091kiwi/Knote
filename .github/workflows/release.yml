# Pushing a version tag builds the Windows installer and a verified,
# stable-signed Android APK, then publishes both to the same Release.
name: Release Knote packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $expected_tag."
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tagged commit $(git rev-parse HEAD) is not reachable from origin/main."
            exit 1
          fi

  android:
    needs: validate
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 hard-requires NodeJS >=22
          node-version: 22
          cache: npm
      # The tracked sync pipeline normalizes generated Capacitor files to 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      # The native project stays generated/ignored: create a fresh platform,
      # then run the same branding/version/signing/Java pipeline used locally.
      - name: Generate fresh Android platform
        run: npx cap add android
      - name: Run tracked Android sync pipeline
        run: npm run cap:sync
      - name: Run native Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android clean :knote-capacitor-android:testDebugUnitTest --no-daemon
      - name: Set temporary release keystore path
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is not configured}"
          [[ -d "$RUNNER_TEMP" ]]
          keystore_path="$RUNNER_TEMP/knote-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          [[ ! -e "$keystore_path" ]]
          printf '%s\n' "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Decode temporary release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Required Android release keystore secret is not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod 600 "$ANDROID_RELEASE_KEYSTORE_PATH"
          [[ "$(stat -c '%a' "$ANDROID_RELEASE_KEYSTORE_PATH")" == "600" ]]
      - name: Verify release keystore certificate
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/knote-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.der"
          trap 'rm -f -- "$cert_path"' EXIT
          keytool -exportcert \
            -keystore "$ANDROID_RELEASE_KEYSTORE_PATH" \
            -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            -file "$cert_path" >/dev/null 2>&1
          expected="B6E9E422D92ED613BF02CCEE1D8E10879B82010C6B09223EAFC99F004BAC7427"
          actual="$(sha256sum "$cert_path" | awk '{ print toupper($1) }')"
          echo "Release keystore certificate SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Release keystore certificate does not match the source-pinned signer."
            exit 1
          fi
      - name: Build signed Android release APK
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/configure-android-signing.mjs --require-release-secrets
          ./android/gradlew -p android assembleRelease --no-daemon
      - name: Verify signed Android release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          # Uses apksigner/aapt to enforce com.kv.knote, package.json's
          # versionName/versionCode, no debuggable flag, and the source-pinned cert.
          node scripts/verify-android-apk.mjs "$APK"
      - name: Stage verified Android release APK
        shell: bash
        run: install -m 0644 android/app/build/outputs/apk/release/app-release.apk "Knote-${GITHUB_REF_NAME}-android-release.apk"
      # Previous debug-signed APKs cannot be updated in place by this stable
      # signer. Users must uninstall once; the package remains com.kv.knote.
      - name: Delete temporary Android keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_RELEASE_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$ANDROID_RELEASE_KEYSTORE_PATH"
            [[ ! -e "$ANDROID_RELEASE_KEYSTORE_PATH" ]]
          fi
      - name: Upload verified Android artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knote-android-release
          path: Knote-*-android-release.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # package.json pins electronDist to node_modules/electron/dist (local
      # proxies truncate electron-builder's own zip download); guarantee that
      # folder exists on the runner by (re)running electron's install script.
      # Must run BEFORE the electron-ui suite: Playwright resolves the
      # npm-installed Electron through electron/index.js, which blocks on a
      # fresh download when dist is missing.
      - run: node node_modules/electron/install.js
      - name: Verify Windows AppContainer broker
        shell: pwsh
        run: |
          npm run test:sandbox-broker *>&1 | Tee-Object sandbox-broker.log
          exit $LASTEXITCODE
      # Source-mode smart editing unit tests (pure string logic, no Electron):
      # kept as a targeted suite so the opt-in source editing feature is
      # covered on CI even though the full npm test chain is not.
      - name: Run source editing unit tests
        run: node --test scripts/source-editing.adversarial.test.mjs
      # Real Electron interaction tests: launches the packaged renderer in an
      # isolated profile and drives clarification/deletion/session switching.
      # Build once, retain the full log, and retry the mouse suite with clean
      # profiles: Windows hosted runners occasionally lose the first Electron
      # window or render a paragraph late, while a deterministic regression
      # still fails every clean retry.
      - name: Run Electron mouse tests
        shell: pwsh
        run: |
          npm run build *>&1 | Tee-Object electron-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $attempt = 0
          do {
            $attempt++
            if ($attempt -gt 1) {
              "Electron mouse-test attempt $attempt with clean profiles." | Tee-Object -Append electron-ui.log
            }
            node --test --test-concurrency=1 scripts/electron-ui.e2e.test.mjs *>&1 | Tee-Object -Append electron-ui.log
            $firstExit = $LASTEXITCODE
            if ($firstExit -eq 0) { exit 0 }
          } while ($attempt -lt 3)
          exit $firstExit
      - run: npx vite build
      # --publish never: on a tagged CI build electron-builder defaults to
      # auto-publishing and dies without a token — the release step below
      # owns publishing instead
      - shell: pwsh
        run: |
          npx electron-builder --win --publish never *>&1 | Tee-Object build.log
          exit $LASTEXITCODE
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: knote-windows-release
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
      # Keep full diagnostics attached to the authenticated run. Do not paste
      # raw logs into a public issue where future tests could expose secrets.
      - name: Upload Windows diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-diagnostics-${{ github.run_attempt }}
          path: |
            sandbox-broker.log
            electron-ui.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

  linux:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # package.json pins electronDist to node_modules/electron/dist (local
      # proxies truncate electron-builder's own zip download); guarantee that
      # folder exists on the runner by (re)running electron's install script.
      - run: node node_modules/electron/install.js
      - run: npx vite build
      # --publish never: on a tagged CI build electron-builder defaults to
      # auto-publishing and dies without a token — the release step below
      # owns publishing instead
      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --linux --publish never 2>&1 | tee build-linux.log
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knote-linux-release
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-diagnostics-${{ github.run_attempt }}
          path: build-linux.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Android release artifact
        uses: actions/download-artifact@v4
        with:
          name: knote-android-release
          path: release-assets/android
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: knote-windows-release
          path: release-assets/windows
      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: knote-linux-release
          path: release-assets/linux
      - name: Verify complete release artifact set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          android_apks=(release-assets/android/Knote-*-android-release.apk)
          windows_installers=(release-assets/windows/Knote-Setup-*.exe)
          linux_appimages=(release-assets/linux/Knote-*.AppImage)
          linux_rpms=(release-assets/linux/Knote-*.rpm)
          linux_debs=(release-assets/linux/Knote-*.deb)
          expected_version="${GITHUB_REF_NAME#v}"
          expected_apk="release-assets/android/Knote-${GITHUB_REF_NAME}-android-release.apk"
          expected_installer="release-assets/windows/Knote-Setup-${expected_version}.exe"
          expected_appimage="release-assets/linux/Knote-${expected_version}.AppImage"
          expected_rpm="release-assets/linux/Knote-${expected_version}.rpm"
          expected_deb="release-assets/linux/Knote-${expected_version}.deb"
          if (( ${#android_apks[@]} != 1 || ${#windows_installers[@]} != 1 )) ||
             (( ${#linux_appimages[@]} != 1 || ${#linux_rpms[@]} != 1 || ${#linux_debs[@]} != 1 )) ||
             [[ "${android_apks[0]:-}" != "$expected_apk" || "${windows_installers[0]:-}" != "$expected_installer" ]] ||
             [[ "${linux_appimages[0]:-}" != "$expected_appimage" || "${linux_rpms[0]:-}" != "$expected_rpm" || "${linux_debs[0]:-}" != "$expected_deb" ]] ||
             [[ ! -s "$expected_apk" || ! -s "$expected_installer" ]] ||
             [[ ! -s "$expected_appimage" || ! -s "$expected_rpm" || ! -s "$expected_deb" ]]; then
            echo "::error::Expected exactly one verified Android APK, one Windows installer, and one of each Linux package (AppImage/rpm/deb)."
            exit 1
          fi
          printf '%s\n' \
            "ANDROID_RELEASE_ASSET=$expected_apk" \
            "WINDOWS_RELEASE_ASSET=$expected_installer" \
            "LINUX_APPIMAGE_ASSET=$expected_appimage" \
            "LINUX_RPM_ASSET=$expected_rpm" \
            "LINUX_DEB_ASSET=$expected_deb" >> "$GITHUB_ENV"
      - name: Publish fail-closed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_ASSET:?Android release asset was not verified}"
          : "${WINDOWS_RELEASE_ASSET:?Windows release asset was not verified}"
          : "${RUNNER_TEMP:?RUNNER_TEMP is not configured}"
          command -v gh > /dev/null || { echo "::error::GitHub CLI is not available."; exit 1; }
          command -v jq > /dev/null || { echo "::error::jq is not available."; exit 1; }
          [[ -s "$ANDROID_RELEASE_ASSET" && -s "$WINDOWS_RELEASE_ASSET" ]]

          release_id=""
          release_published=false
          ownership_marker="knote-release-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          cleanup_created_draft() {
            exit_code=$?
            trap - EXIT
            if (( exit_code != 0 )) && [[ -n "$release_id" ]] && [[ "$release_published" != true ]]; then
              current_release="$RUNNER_TEMP/knote-release-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
              if gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$current_release" 2>/dev/null &&
                 jq -e \
                   --arg tag "$GITHUB_REF_NAME" \
                   --arg marker "$ownership_marker" \
                   --argjson id "$release_id" \
                   '.id == $id and .tag_name == $tag and .draft == true and (.body | contains($marker))' \
                   "$current_release" > /dev/null; then
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" > /dev/null ||
                  echo "::warning::Could not delete draft release $release_id; it remains unpublished."
              else
                echo "::warning::Refusing to delete release $release_id because draft ownership could not be proven."
              fi
            fi
            exit "$exit_code"
          }
          trap cleanup_created_draft EXIT

          release_tags="$RUNNER_TEMP/knote-release-tags-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > "$release_tags"
          if grep -Fqx -- "$GITHUB_REF_NAME" "$release_tags"; then
            echo "::error::A GitHub Release already exists for $GITHUB_REF_NAME; refusing to mutate it."
            exit 1
          fi

          generated_notes="$RUNNER_TEMP/knote-generated-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=$GITHUB_REF_NAME" \
            -f "target_commitish=$GITHUB_SHA" > "$generated_notes"
          release_name="$(jq -r --arg tag "$GITHUB_REF_NAME" '.name // $tag' "$generated_notes")"
          generated_body="$(jq -r '.body // ""' "$generated_notes")"
          transition_warning='> **Android signing transition:** Back up any app-local data you need before installing. APKs from v1.1.37 and earlier were debug-signed and cannot be upgraded in place. Uninstall the old Android app, then reinstall this APK. Uninstalling removes app-local settings, API keys, and sessions.'
          release_body="${transition_warning}"$'\n\n'"${generated_body}"$'\n\n'"<!-- ${ownership_marker} -->"

          create_payload="$RUNNER_TEMP/knote-release-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          create_response="$RUNNER_TEMP/knote-release-created-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg target "$GITHUB_SHA" \
            --arg name "$release_name" \
            --arg body "$release_body" \
            '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: false}' \
            > "$create_payload"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases" --input "$create_payload" > "$create_response"
          release_id="$(jq -er '.id' "$create_response")"
          jq -e --arg tag "$GITHUB_REF_NAME" --arg marker "$ownership_marker" --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == true and (.body | contains($marker))' \
            "$create_response" > /dev/null

          gh release upload "$GITHUB_REF_NAME" \
            "$ANDROID_RELEASE_ASSET" \
            "$WINDOWS_RELEASE_ASSET" \
            "$LINUX_APPIMAGE_ASSET" \
            "$LINUX_RPM_ASSET" \
            "$LINUX_DEB_ASSET" \
            --repo "$GITHUB_REPOSITORY"

          remote_assets="$RUNNER_TEMP/knote-release-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$remote_assets"
          apk_name="$(basename "$ANDROID_RELEASE_ASSET")"
          installer_name="$(basename "$WINDOWS_RELEASE_ASSET")"
          appimage_name="$(basename "$LINUX_APPIMAGE_ASSET")"
          rpm_name="$(basename "$LINUX_RPM_ASSET")"
          deb_name="$(basename "$LINUX_DEB_ASSET")"
          apk_size="$(stat -c '%s' "$ANDROID_RELEASE_ASSET")"
          installer_size="$(stat -c '%s' "$WINDOWS_RELEASE_ASSET")"
          appimage_size="$(stat -c '%s' "$LINUX_APPIMAGE_ASSET")"
          rpm_size="$(stat -c '%s' "$LINUX_RPM_ASSET")"
          deb_size="$(stat -c '%s' "$LINUX_DEB_ASSET")"
          jq -e \
            --arg apk "$apk_name" \
            --arg installer "$installer_name" \
            --arg appimage "$appimage_name" \
            --arg rpm "$rpm_name" \
            --arg deb "$deb_name" \
            --argjson apk_size "$apk_size" \
            --argjson installer_size "$installer_size" \
            --argjson appimage_size "$appimage_size" \
            --argjson rpm_size "$rpm_size" \
            --argjson deb_size "$deb_size" \
            'length == 5 and
             any(.[]; .name == $apk and .state == "uploaded" and .size == $apk_size) and
             any(.[]; .name == $installer and .state == "uploaded" and .size == $installer_size) and
             any(.[]; .name == $appimage and .state == "uploaded" and .size == $appimage_size) and
             any(.[]; .name == $rpm and .state == "uploaded" and .size == $rpm_size) and
             any(.[]; .name == $deb and .state == "uploaded" and .size == $deb_size)' \
            "$remote_assets" > /dev/null

          current_release="$RUNNER_TEMP/knote-release-before-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$current_release"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --arg marker "$ownership_marker" \
            --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == true and (.body | contains($marker))' \
            "$current_release" > /dev/null

          publish_response="$RUNNER_TEMP/knote-release-published-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false > "$publish_response"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .draft == false' "$publish_response" > /dev/null
          release_published=true
