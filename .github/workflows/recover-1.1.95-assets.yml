name: Recover verified 1.1.95 release assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.95
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Package the already locally tested application
        shell: pwsh
        run: |
          npm run dist:win
          exit $LASTEXITCODE
      - name: Require every application resource to match the locally tested build
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto'), asar = require('@electron/asar');
          const files = [];
          function walk(dir) {
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, item.name);
              if (item.isDirectory()) walk(file); else files.push(file.replaceAll('\\', '/'));
            }
          }
          walk('dist'); walk('electron'); files.push('build/icon.png');
          const hash = crypto.createHash('sha256');
          for (const file of files.sort()) {
            const data = fs.readFileSync(file);
            if (!asar.extractFile('release/win-unpacked/resources/app.asar', file).equals(data)) throw Error('ASAR mismatch: ' + file);
            hash.update(file + '\0' + crypto.createHash('sha256').update(data).digest('hex') + '\n');
          }
          const digest = hash.digest('hex');
          if (files.length !== 191 || digest !== '91a2ed65d40c303b39fa48dc3fefe8cde34ebe974226883d02bdb9c140f9a495') throw Error('Locally tested application resource mismatch: ' + digest);
          console.log('VERIFIED_LOCALLY_TESTED_RESOURCES', files.length, digest);
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath release/Knote-Setup-1.1.95.exe -Algorithm SHA256 | Format-List
      - name: Upload the verified installer only if the owned draft still needs it
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh api repos/1661169091kiwi/Knote/releases/416920697 | ConvertFrom-Json
          if ($release.tag_name -ne 'v1.1.95' -or -not $release.body.Contains('knote-manual-release:v1.1.95:a468bd14a4ec116377bdd32dc8be2065bae24a42')) { throw 'Release ownership mismatch' }
          if (-not $release.draft) { Write-Output 'Already published; no changes'; exit 0 }
          $existing = @($release.assets | Where-Object name -eq 'Knote-Setup-1.1.95.exe')
          if ($existing.Count -gt 0) { Write-Output 'Installer already present; preserving it'; exit 0 }
          gh release upload v1.1.95 release/Knote-Setup-1.1.95.exe --repo 1661169091kiwi/Knote
          exit $LASTEXITCODE
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the successful Linux build from the tagged release run
        uses: actions/download-artifact@v4
        with:
          name: knote-linux-release
          run-id: 39201361434
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-linux
      - name: Verify and upload only missing assets to the owned draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo='1661169091kiwi/Knote'
          release_id='416920697'
          marker='knote-manual-release:v1.1.95:a468bd14a4ec116377bdd32dc8be2065bae24a42'
          gh api "repos/$repo/releases/$release_id" > release-state.json
          jq -e --arg marker "$marker" '.draft == true and .tag_name == "v1.1.95" and (.body | contains($marker))' release-state.json
          cd verified-linux
          printf '%s\n' \
            '458e24f15108b88069b49f8ce1dd68e365e4bc2e305f192499e7793074f6bec7  Knote-1.1.95.AppImage' \
            '9396fd95433a197109544df3c3b83bebadb001057b6dfa596ed58236b07990e2  Knote-1.1.95.deb' \
            '474cde532390bc414d7dbe3473e9babe5553fd3620d28a5627e4e7471e81ea5e  Knote-1.1.95.rpm' | sha256sum --check -
          for file in Knote-1.1.95.AppImage Knote-1.1.95.deb Knote-1.1.95.rpm; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size="$(stat -c '%s' "$file")"
            gh api "repos/$repo/releases/$release_id/assets" > ../asset-state.json
            if jq -e --arg name "$file" --arg digest "$digest" --argjson size "$size" 'any(.[]; .name == $name and .state == "uploaded" and .digest == $digest and .size == $size)' ../asset-state.json; then
              continue
            fi
            gh release upload v1.1.95 "$file" --repo "$repo"
          done
          gh api "repos/$repo/releases/$release_id/assets" --jq '.[] | {name, state, size, digest}'
