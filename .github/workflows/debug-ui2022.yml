name: debug-ui2022
on:
  push:
    branches: [debug-ui2022]
  workflow_dispatch:

jobs:
  ui:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Electron mouse tests on windows-2022
        shell: pwsh
        run: |
          npm run build *>&1 | Tee-Object electron-ui-2022.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 scripts/electron-ui.e2e.test.mjs *>&1 | Tee-Object -Append electron-ui-2022.log
          exit $LASTEXITCODE
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-ui-2022-log
          path: electron-ui-2022.log
