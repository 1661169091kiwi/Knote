name: Editor tutorial preflight

on:
  push:
    branches: ['codex/release-preflight']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build renderer
        shell: pwsh
        run: |
          npm run build *>&1 | Tee-Object tutorial-preflight.log
          exit $LASTEXITCODE
      - name: Verify startup, reload and streaming fixture lifecycle
        shell: pwsh
        run: |
          node --test --test-concurrency=1 --test-timeout=180000 --test-reporter=tap --test-name-pattern="Agent provisional streaming|a paragraph directly under a table|reload excludes every live run id|folder browsing keeps|folder search indexes" scripts/electron-ui.e2e.test.mjs *>&1 | Tee-Object -Append tutorial-preflight.log
          exit $LASTEXITCODE
      - name: Verify the complete Electron interaction suite
        shell: pwsh
        run: |
          node --test --test-concurrency=1 --test-timeout=900000 --test-reporter=tap scripts/electron-ui.e2e.test.mjs *>&1 | Tee-Object -Append tutorial-preflight.log
          exit $LASTEXITCODE
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-preflight-diagnostics
          path: tutorial-preflight.log
          retention-days: 7
